name: Build Native CyberDrop Binaries (.exe & .apk)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =================================================================
  # 1. ANDROID APK BUILD JOB (Generates CyberDrop.apk)
  # =================================================================
  build-android:
    name: Build Android APK (CyberDrop.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17 Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk ./CyberDrop.apk

      - name: Validate APK Binary Size
        run: |
          APK_SIZE_BYTES=$(stat -c%s CyberDrop.apk)
          APK_SIZE_MB=$((APK_SIZE_BYTES / 1024 / 1024))
          echo "Generated CyberDrop.apk size: ${APK_SIZE_MB} MB (${APK_SIZE_BYTES} bytes)"
          if [ "$APK_SIZE_MB" -gt 25 ]; then
            echo "Warning: APK size is larger than expected"
          fi

      - name: Upload Standalone CyberDrop.apk
        uses: actions/upload-artifact@v4
        with:
          name: CyberDrop-Android-APK
          path: CyberDrop.apk
          retention-days: 14

  # =================================================================
  # 2. WINDOWS EXE BUILD JOB (Generates CyberDrop.exe)
  # =================================================================
  build-windows:
    name: Build Windows Executable (CyberDrop.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Production Assets
        run: npm run build

      - name: Compile Native Windows WebView2 Executable
        run: |
          New-Item -ItemType Directory -Force -Path "windows\dist"
          Copy-Item -Path "dist\*" -Destination "windows\dist" -Recurse -Force
          
          # Publish single-file executable using .NET and WebView2
          dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o output\ windows\CyberDrop.csproj
          
          # Place dist assets alongside exe
          New-Item -ItemType Directory -Force -Path "output\dist"
          Copy-Item -Path "dist\*" -Destination "output\dist" -Recurse -Force
          Copy-Item -Path "output\CyberDrop.exe" -Destination ".\CyberDrop.exe" -Force

      - name: Package Windows Portable Release
        run: |
          Compress-Archive -Path "output\*" -DestinationPath "CyberDrop-Windows-x64.zip" -Force

      - name: Upload Standalone CyberDrop.exe & Package
        uses: actions/upload-artifact@v4
        with:
          name: CyberDrop-Windows-EXE
          path: |
            CyberDrop.exe
            CyberDrop-Windows-x64.zip
          retention-days: 14

  # =================================================================
  # 3. GITHUB RELEASES (On Tag)
  # =================================================================
  publish-release:
    name: Publish GitHub Release Assets
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: CyberDrop-Android-APK

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: CyberDrop-Windows-EXE

      - name: Create Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CyberDrop.apk
            CyberDrop.exe
            CyberDrop-Windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
